name: ci

on:
  push:
    branches: [main]
  pull_request:

# Deploys are handled by Vercel's GitHub integration, which builds every push
# and every PR on its own. This workflow only gates correctness.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Engine tests (no dependencies)
        run: python test_router.py

      - name: Tokenomics tests (no dependencies)
        run: python test_tokenomics.py

      - name: API tests
        run: python test_api.py

      - name: Vercel entrypoint boots in routing-only mode
        run: |
          python - <<'PY'
          import os
          os.environ["ROUTER_OFFLINE"] = "1"
          from api.index import app
          from fastapi.testclient import TestClient

          c = TestClient(app)
          health = c.get("/api/health").json()
          assert health["mode"] == "cloud", health
          route = c.post("/api/route", json={"prompt": "write a python function"}).json()
          assert route["decision"]["category"] == "code", route
          assert c.post("/api/v1/chat/completions", json={"prompt": "hi"}).status_code == 503
          print("routing-only entrypoint OK ->", route["selected_model"])
          PY
